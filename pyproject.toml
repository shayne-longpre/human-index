[project]
name = "atlas-etl"
version = "0.1.0"
description = "Offline evidence pipeline for Atlas of Humanity"
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "pyproj==3.7.2",
  "pyreadr==0.5.4",
  "rasterio==1.4.4",
  "shapely==2.1.2",
]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
